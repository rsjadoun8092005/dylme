<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e94d58;
            --primary-hover: #d63d48;
            --primary-light: #ff758f;
            --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffeef2 100%);
            --card-bg: rgba(255, 255, 255, 0.90);
            --text-dark: #2d2327;
            --text-muted: #7a5c61;
            --shadow: 0 20px 50px rgba(233, 77, 88, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Poppins', Verdana, Geneva, Tahoma, sans-serif;
            color: var(--text-dark);
            overflow-x: hidden;
            position: relative;
            padding: 24px 16px 70px;
        }

        /* Floating background hearts */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-particle {
            position: absolute;
            bottom: -50px;
            color: rgba(233, 77, 88, 0.22);
            animation: floatUp linear infinite;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Main Glassmorphism Card */
        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 510px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 28px;
            padding: 32px 28px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: cardEntrance 0.6s ease-out;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .gif-container {
            width: 185px;
            height: 185px;
            margin: 0 auto 20px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 24px rgba(233, 77, 88, 0.12);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .gif-container.compact {
            width: 130px;
            height: 130px;
            margin-bottom: 14px;
        }

        .gif {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gif:hover {
            transform: scale(1.04);
        }

        .question {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 18px;
            line-height: 1.35;
            min-height: 2.2em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .subtext {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-top: -10px;
            margin-bottom: 18px;
        }

        .center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"] {
            width: 100%;
            height: 48px;
            padding: 10px 18px;
            font-size: 0.98rem;
            font-family: inherit;
            border-radius: 16px;
            border: 2px solid rgba(233, 77, 88, 0.3);
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-dark);
            outline: none;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        #fname {
            max-width: 360px;
            height: 52px;
            border-radius: 50px;
            text-align: center;
            font-size: 1.05rem;
        }

        input::placeholder {
            color: #b89aa0;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(233, 77, 88, 0.15);
            transform: translateY(-1px);
        }

        .shake {
            animation: shakeAnim 0.4s ease-in-out;
            border-color: var(--primary) !important;
        }

        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-6px); }
        }

        .btn-group {
            width: 100%;
            min-height: 56px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
            position: relative;
        }

        button {
            width: 155px;
            height: 50px;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: inherit;
            border-radius: 50px;
            border: 2px solid var(--primary);
            outline: none;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 6px 18px rgba(233, 77, 88, 0.25);
            user-select: none;
        }

        #start_button,
        .yes-btn,
        .primary-btn {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white;
            border: none;
        }

        .primary-btn {
            width: 100%;
            height: 52px;
            margin-top: 6px;
            font-size: 1.05rem;
        }

        #start_button:hover,
        .yes-btn:hover,
        .primary-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 24px rgba(233, 77, 88, 0.38);
        }

        #start_button:active,
        .yes-btn:active,
        .primary-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .no-btn {
            background: white;
            color: var(--primary);
            z-index: 10;
            transition: left 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
                        top 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.2s ease;
        }

        .no-btn:hover {
            background: #fff5f6;
        }

        /* Date Planner Form Styles */
        .planner-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
            width: 100%;
            animation: fadeIn 0.45s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .field-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .activity-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .activity-card {
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid rgba(233, 77, 88, 0.22);
            border-radius: 16px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.22s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            user-select: none;
        }

        .activity-card .emoji {
            font-size: 1.65rem;
            line-height: 1.1;
        }

        .activity-card .title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .activity-card:hover {
            border-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .activity-card.active {
            background: #fff0f3;
            border-color: var(--primary);
            box-shadow: 0 6px 16px rgba(233, 77, 88, 0.18);
            transform: translateY(-2px);
        }

        .activity-card.active .title {
            color: var(--primary);
        }

        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 7px;
        }

        .chip {
            font-size: 0.76rem;
            background: rgba(233, 77, 88, 0.09);
            color: var(--primary);
            padding: 4px 11px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            user-select: none;
        }

        .chip:hover {
            background: rgba(233, 77, 88, 0.18);
            border-color: rgba(233, 77, 88, 0.3);
        }

        .date-time-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Date Ticket / Summary Card */
        .ticket-card {
            background: linear-gradient(145deg, #fff8f9, #ffffff);
            border: 2px dashed rgba(233, 77, 88, 0.45);
            border-radius: 20px;
            padding: 18px 20px;
            text-align: left;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(233, 77, 88, 0.08);
            animation: fadeIn 0.45s ease-out;
        }

        .ticket-header {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(233, 77, 88, 0.15);
            padding-bottom: 8px;
        }

        .ticket-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 0.92rem;
        }

        .ticket-row span:first-child {
            color: var(--text-muted);
            font-weight: 500;
        }

        .ticket-row span:last-child {
            font-weight: 600;
            color: var(--text-dark);
            text-align: right;
        }

        .send-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .send-btn {
            width: 100%;
            height: 48px;
            border-radius: 50px;
            font-size: 0.98rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .whatsapp-btn {
            background: linear-gradient(135deg, #25D366, #1ebe57);
            color: white;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.28);
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(37, 211, 102, 0.38);
        }

        .secondary-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .outline-btn {
            background: white;
            color: var(--primary);
            border: 2px solid rgba(233, 77, 88, 0.35);
            box-shadow: none;
            height: 44px;
            font-size: 0.9rem;
            width: 100%;
        }

        .outline-btn:hover {
            background: #fff5f6;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .status-toast {
            font-size: 0.82rem;
            color: #1ebe57;
            font-weight: 600;
            min-height: 1.2em;
            margin-top: 4px;
        }

        /* Credit Footer */
        .footer-credit {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            font-size: 0.88rem;
            font-weight: 500;
            color: #7a4248;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 14px rgba(233, 77, 88, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.85);
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .footer-credit span {
            color: var(--primary);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .wrapper {
                padding: 24px 18px;
            }
            .question {
                font-size: 1.25rem;
            }
            .gif-container {
                width: 160px;
                height: 160px;
            }
            .date-time-row,
            .secondary-actions {
                grid-template-columns: 1fr;
            }
            button {
                width: 135px;
                height: 46px;
                font-size: 0.98rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background Floating Hearts -->
    <div class="hearts-bg" id="hearts-bg"></div>

    <!-- Main Content Card -->
    <div class="wrapper" id="card-wrapper">
        <div class="gif-container" id="gif-box">
            <img class="gif" id="main-gif" alt="cute gif" src="https://media.giphy.com/media/hiJ9ypGI5tIKdwKoK2/giphy.gif"/>
        </div>
        <h1 class="question" id="main-question">What is your name? I want to know you better</h1>
        <p class="subtext" id="sub-question" style="display: none;"></p>
        <div class="center" id="interaction-area">
            <input type="text" id="fname" name="fname" placeholder="Enter your name..." autocomplete="off">
            <button id="start_button">Start!</button>
        </div>
    </div>

    <!-- Footer Credit -->
    <footer class="footer-credit">
        Made by <span>Raghvendra</span> for someone special ❤️
    </footer>

    <script>
        /* =========================================================================
           OPTIONAL CONFIGURATION FOR RAGHVENDRA:
           - whatsappNumber: Add your phone number with country code (e.g. "919876543210")
                             If left blank, WhatsApp will still open with the full date
                             message ready to select your chat!
           - email: Add your email address (e.g. "raghvendra@example.com") to receive
                    responses via Email / FormSubmit automatically.
           ========================================================================= */
        const CONFIG = {
            whatsappNumber: "",
            email: ""
        };

        const gifBox = document.getElementById("gif-box");
        const gifElement = document.getElementById("main-gif");
        const questionElement = document.getElementById("main-question");
        const subQuestion = document.getElementById("sub-question");
        const interactionArea = document.getElementById("interaction-area");
        const fnameInput = document.getElementById("fname");
        const startButton = document.getElementById("start_button");

        let userName = "";
        let count = 0;
        let yesButton = null;
        let noButton = null;
        let selectedActivity = "Coffee Date ☕";

        // Generate subtle floating hearts in the background
        function createBackgroundHearts() {
            const container = document.getElementById("hearts-bg");
            const symbols = ["❤", "♥", "💕", "💖"];
            for (let i = 0; i < 18; i++) {
                const heart = document.createElement("div");
                heart.className = "heart-particle";
                heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.fontSize = (Math.random() * 18 + 14) + "px";
                heart.style.animationDuration = (Math.random() * 8 + 7) + "s";
                heart.style.animationDelay = (Math.random() * 6) + "s";
                container.appendChild(heart);
            }
        }
        createBackgroundHearts();

        function handleStart() {
            userName = fnameInput.value.trim();

            if (userName === "") {
                gifElement.src = "https://media.giphy.com/media/VB3cK9oA48BbQWcObd/giphy.gif";
                questionElement.innerHTML = "Please give me your name before you start!";
                fnameInput.classList.remove("shake");
                void fnameInput.offsetWidth; // trigger reflow
                fnameInput.classList.add("shake");
                fnameInput.focus();
            } else {
                // Transition to Main Question View
                questionElement.innerHTML = "Hello " + escapeHtml(userName) + "! Will you go out with me?";
                gifElement.src = "https://media.giphy.com/media/0kDdAFAELmvvFNUKim/giphy.gif";

                interactionArea.className = "btn-group";
                interactionArea.innerHTML = `
                    <button class="yes-btn" id="yes-btn">Yes</button>
                    <button class="no-btn" id="no-btn">No</button>
                `;

                yesButton = document.getElementById("yes-btn");
                noButton = document.getElementById("no-btn");

                yesButton.addEventListener("click", yesButtonListener);
                noButton.addEventListener("click", noButtonListener);
            }
        }

        startButton.addEventListener("click", handleStart);
        fnameInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                handleStart();
            }
        });

        function yesButtonListener() {
            // Remove runaway No button if it was moved to body
            if (noButton && noButton.parentNode === document.body) {
                noButton.remove();
            }

            launchCelebrationHearts();

            gifBox.classList.add("compact");
            gifElement.src = "https://media.giphy.com/media/fHGl1MDMNkO6fOaFDF/giphy.gif";
            questionElement.innerHTML = "Yay! Thank you for loving me ❤️, " + escapeHtml(userName) + "!";
            subQuestion.style.display = "block";
            subQuestion.innerText = "Now let's book our special date together ✨";

            // Default tomorrow's date
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const yyyy = tomorrow.getFullYear();
            const mm = String(tomorrow.getMonth() + 1).padStart(2, "0");
            const dd = String(tomorrow.getDate()).padStart(2, "0");
            const defaultDate = `${yyyy}-${mm}-${dd}`;

            interactionArea.className = "planner-form";
            interactionArea.innerHTML = `
                <div>
                    <label class="field-label">1. Pick our date vibe</label>
                    <div class="activity-grid" id="activity-grid">
                        <div class="activity-card active" data-activity="Coffee Date ☕">
                            <span class="emoji">☕</span>
                            <span class="title">Coffee</span>
                        </div>
                        <div class="activity-card" data-activity="Movie Date 🎬">
                            <span class="emoji">🎬</span>
                            <span class="title">Movie</span>
                        </div>
                        <div class="activity-card" data-activity="Dinner Date 🍽️">
                            <span class="emoji">🍽️</span>
                            <span class="title">Dinner</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="field-label" for="place-input">2. Where should we go?</label>
                    <input type="text" id="place-input" placeholder="Name a cafe, theatre, restaurant, or 'Surprise me!'" autocomplete="off">
                    <div class="quick-chips">
                        <span class="chip" data-place="Your favorite spot ❤️">Your favorite spot ❤️</span>
                        <span class="chip" data-place="A cozy aesthetic cafe ☕">Cozy cafe ☕</span>
                        <span class="chip" data-place="Surprise me! ✨">Surprise me! ✨</span>
                    </div>
                </div>

                <div class="date-time-row">
                    <div>
                        <label class="field-label" for="date-input">3. Date</label>
                        <input type="date" id="date-input" value="${defaultDate}" min="${defaultDate}">
                    </div>
                    <div>
                        <label class="field-label" for="time-input">4. Time</label>
                        <input type="time" id="time-input" value="18:30">
                    </div>
                </div>

                <button type="button" class="primary-btn" id="book-date-btn">Book Date & Send to Raghvendra 💌</button>
            `;

            // Activity selection logic
            const cards = document.querySelectorAll(".activity-card");
            cards.forEach(card => {
                card.addEventListener("click", () => {
                    cards.forEach(c => c.classList.remove("active"));
                    card.classList.add("active");
                    selectedActivity = card.getAttribute("data-activity");
                });
            });

            // Quick place chips logic
            const placeInput = document.getElementById("place-input");
            document.querySelectorAll(".chip").forEach(chip => {
                chip.addEventListener("click", () => {
                    placeInput.value = chip.getAttribute("data-place");
                });
            });

            document.getElementById("book-date-btn").addEventListener("click", handleBookDate);
        }

        function handleBookDate() {
            const placeInput = document.getElementById("place-input");
            const dateInput = document.getElementById("date-input");
            const timeInput = document.getElementById("time-input");

            const place = placeInput.value.trim() || "Surprise me! ✨";
            const rawDate = dateInput.value;
            const rawTime = timeInput.value;

            if (!rawDate || !rawTime) {
                if (!rawDate) dateInput.classList.add("shake");
                if (!rawTime) timeInput.classList.add("shake");
                setTimeout(() => {
                    dateInput.classList.remove("shake");
                    timeInput.classList.remove("shake");
                }, 450);
                return;
            }

            const formattedDate = formatNiceDate(rawDate);
            const formattedTime = formatNiceTime(rawTime);

            const responseMessage =
                `Hey Raghvendra! ❤️

` +
                `I said YES! Here are the details for our date:
` +
                `👤 Name: ${userName}
` +
                `✨ Activity: ${selectedActivity}
` +
                `📍 Place: ${place}
` +
                `📅 Date: ${formattedDate}
` +
                `⏰ Time: ${formattedTime}

` +
                `Can't wait to see you! 💕`;

            const whatsappUrl = `https://api.whatsapp.com/send?phone=${encodeURIComponent(CONFIG.whatsappNumber)}&text=${encodeURIComponent(responseMessage)}`;
            const mailtoUrl = `mailto:${encodeURIComponent(CONFIG.email)}?subject=${encodeURIComponent("It's a Date! ❤️ - from " + userName)}&body=${encodeURIComponent(responseMessage)}`;

            questionElement.innerHTML = "It's Official! Our Date is Set 🥂";
            subQuestion.innerText = "Send this ticket to Raghvendra so he knows the plan!";

            interactionArea.className = "center";
            interactionArea.innerHTML = `
                <div class="ticket-card" style="width: 100%;">
                    <div class="ticket-header">
                        <span>🎟️ Official Date Pass</span>
                        <span>Confirmed ❤️</span>
                    </div>
                    <div class="ticket-row"><span>With</span><span>${escapeHtml(userName)}</span></div>
                    <div class="ticket-row"><span>Activity</span><span>${escapeHtml(selectedActivity)}</span></div>
                    <div class="ticket-row"><span>Somewhere</span><span>${escapeHtml(place)}</span></div>
                    <div class="ticket-row"><span>Date</span><span>${escapeHtml(formattedDate)}</span></div>
                    <div class="ticket-row"><span>Time</span><span>${escapeHtml(formattedTime)}</span></div>
                </div>

                <div class="send-actions">
                    <a href="${whatsappUrl}" target="_blank" rel="noopener noreferrer" class="send-btn whatsapp-btn">
                        💬 Send Response on WhatsApp
                    </a>
                    <div class="secondary-actions">
                        <a href="${mailtoUrl}" class="send-btn outline-btn">
                            ✉️ Send via Email
                        </a>
                        <button type="button" class="send-btn outline-btn" id="copy-btn">
                            📋 Copy Response
                        </button>
                    </div>
                    <div class="status-toast" id="status-toast"></div>
                </div>
            `;

            launchCelebrationHearts();

            // Optional silent email notification if CONFIG.email is configured
            if (CONFIG.email && CONFIG.email.includes("@")) {
                fetch("https://formsubmit.co/ajax/" + encodeURIComponent(CONFIG.email), {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        _subject: `New Date Booking from ${userName}! ❤️`,
                        Name: userName,
                        Activity: selectedActivity,
                        Place: place,
                        Date: formattedDate,
                        Time: formattedTime,
                        Message: responseMessage
                    })
                }).then(() => {
                    const toast = document.getElementById("status-toast");
                    if (toast) toast.innerText = "✨ Response also emailed to Raghvendra automatically!";
                }).catch(() => {});
            }

            document.getElementById("copy-btn").addEventListener("click", () => {
                navigator.clipboard.writeText(responseMessage).then(() => {
                    const toast = document.getElementById("status-toast");
                    toast.innerText = "✅ Copied! Paste & send it to Raghvendra ❤️";
                });
            });
        }

        function noButtonListener() {
            if (count < 5) {
                gifElement.src = "https://media.giphy.com/media/hbOgjMOUfLdWV2Ty1j/giphy.gif";
                questionElement.innerHTML = "You don't love me?";
            } else if (count >= 5 && count < 10) {
                gifElement.src = "https://media.giphy.com/media/QuCslOrnS649PSCnn7/giphy.gif";
                questionElement.innerHTML = "Stop playing with me! Do you love me or not?!";
            } else {
                gifElement.src = "https://media.giphy.com/media/8OPf6xrtXi3QEcu5h9/giphy.gif";
                questionElement.innerHTML = "JUST ANSWER IT! DO YOU LOVE ME?!";
            }

            if (noButton.parentNode !== document.body) {
                document.body.appendChild(noButton);
            }

            const noButtonRect = noButton.getBoundingClientRect();
            const padding = 20;
            const maxX = Math.max(padding, window.innerWidth - noButtonRect.width - padding);
            const maxY = Math.max(padding, window.innerHeight - noButtonRect.height - 60);

            const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;

            noButton.style.position = "fixed";
            noButton.style.left = randomX + "px";
            noButton.style.top = randomY + "px";

            count = count + 1;
        }

        function formatNiceDate(dateStr) {
            const parts = dateStr.split("-");
            if (parts.length !== 3) return dateStr;
            const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
            return dateObj.toLocaleDateString("en-US", {
                weekday: "short",
                month: "short",
                day: "numeric",
                year: "numeric"
            });
        }

        function formatNiceTime(timeStr) {
            const [hourStr, minute] = timeStr.split(":");
            let hour = parseInt(hourStr, 10);
            const ampm = hour >= 12 ? "PM" : "AM";
            hour = hour % 12 || 12;
            return `${hour}:${minute} ${ampm}`;
        }

        function launchCelebrationHearts() {
            const container = document.getElementById("hearts-bg");
            const symbols = ["❤️", "💖", "💘", "💝", "✨"];
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement("div");
                heart.className = "heart-particle";
                heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.fontSize = (Math.random() * 24 + 18) + "px";
                heart.style.animationDuration = (Math.random() * 4 + 3) + "s";
                heart.style.animationDelay = (Math.random() * 1.5) + "s";
                container.appendChild(heart);
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                })[m];
            });
        }
    </script>
</body>
